name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Targets unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # locked: false so CI re-resolves each run. Sibling repos are pulled via
      # git+...@dev (a moving branch), so we intentionally test against the
      # latest dev of those dependencies rather than a frozen pixi.lock snapshot.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
          locked: false
          cache: true

      - name: Run tests
        run: pixi run -e dev pytest tests/ -v
