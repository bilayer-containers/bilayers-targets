name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Targets unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
          locked: true
          cache: true

      - name: Run tests
        run: pixi run -e dev pytest tests/ -v
