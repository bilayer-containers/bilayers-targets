name: Update schema lockfile

on:
  repository_dispatch:
    types: [schema-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Regenerate lockfile
        run: pixi lock

      - name: Check for drift
        id: check
        run: |
          if git diff --quiet pixi.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if lockfile changed
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8

        with:
          token: ${{ secrets.REPO_TRIGGER_TOKEN }}
          commit-message: "[chore] update pixi.lock for schema change"
          branch: update/update-schema-lockfile
          title: "Auto-update pixi.lock (schema change)"
          body: |
             Triggered by bilayers-schema PR #${{ github.event.client_payload.pr_number }}
             (commit ${{ github.event.client_payload.schema_commit_sha }}).
             This is an automated update to the pixi.lock file.
             Regenerated pixi.lock to pick up that change.
